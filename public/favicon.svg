<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0f0f13" />
    </linearGradient>
  </defs>
  
  <!-- Rounded app icon background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" />
  
  <!-- Piano Keys -->
  <g transform="translate(4, 6)">
    <!-- White Keys -->
    <rect x="0" y="0" width="5.5" height="20" rx="1" fill="#ffffff" />
    <rect x="6" y="0" width="5.5" height="20" rx="1" fill="#ffffff" />
    <rect x="12" y="0" width="5.5" height="20" rx="1" fill="#ffffff" />
    <rect x="18" y="0" width="5.5" height="20" rx="1" fill="#ffffff" />
    
    <!-- Black Keys -->
    <rect x="4" y="0" width="3.2" height="12" rx="0.6" fill="#0f0f13" />
    <rect x="16" y="0" width="3.2" height="12" rx="0.6" fill="#0f0f13" />
  </g>
</svg>
